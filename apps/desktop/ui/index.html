<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DesktopPet</title><link rel="stylesheet" href="style.css">
<main><span class="eyebrow">DESKTOPPET · 本地预览</span><h1>你的桌面伙伴</h1><p id="status" role="status">正在读取状态…</p><p id="detail"></p><div class="actions"><button data-action="show">显示角色</button><button data-action="hide">隐藏角色</button><button data-action="retry">重试连接</button></div>
<section><h2>角色库</h2><label for="pack-path">角色包 manifest.json 的完整路径</label><div class="row"><input id="pack-path" placeholder="/…/角色包/manifest.json"><button id="import">导入并切换</button></div><p id="import-message" role="status"></p><label for="pack-list">已导入角色</label><div class="row"><select id="pack-list"><option value="">暂无已导入角色</option></select><button id="switch">切换角色</button></div><p class="hint">导入会创建本地副本，原始资源保持不变。加载失败时保留当前角色。支持目录包，暂不支持压缩包。</p></section>
<section><label for="scale">角色大小 <output id="scale-value">100%</output></label><input id="scale" type="range" min="50" max="150" step="5" value="100"><p class="hint">短按头部或身体触发表情，拖拽不触发表情。具体反馈取决于角色包配置。</p></section>
<p class="hint">关闭此窗口后，角色仍会运行。菜单栏 Pet 可随时隐藏或退出。他应用窗口吸附尚未开放。</p><button class="quiet" data-action="quit">退出 DesktopPet</button></main><script src="app.js"></script></html>
