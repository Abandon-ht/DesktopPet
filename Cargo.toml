[workspace]
members = [
    "apps/desktop",
    "apps/avatar-host-2d",
    "crates/pet-core",
    "crates/pet-protocol",
    "crates/pet-ipc",
    "crates/avatar-pack",
    "tools/p0-probe",
    "tools/p0-ipc-probe",
    "tools/p0-tauri-probe",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
mocari = { version = "=0.3.1", features = ["wgpu"] }
wgpu = "=30.0.0"
winit = "=0.30.13"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
