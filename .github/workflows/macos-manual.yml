name: Build macOS app (manual)

on:
  workflow_dispatch:
    inputs:
      resource_tag:
        description: Release tag containing separately packaged build resources
        required: true
        default: resources-2026-09-29
        type: string

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Download resource archives from the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_TAG: ${{ inputs.resource_tag }}
        run: |
          mkdir -p artifacts/local/release-assets
          gh release download "$RESOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/local/release-assets \
            --pattern '*.zip' \
            --pattern 'SHA256SUMS.json'
      - name: Compile application and avatar host
        run: cargo +1.95.0 build --locked --release -p desktop-pet -p avatar-host-2d
      - name: Assemble and ad-hoc sign macOS app
        run: |
          python3 tools/release/package_macos.py \
            --assets-dir artifacts/local/release-assets \
            --require-assets \
            --output artifacts/local/release/DesktopPet.app
      - name: Upload drag-install DMG
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-macOS-arm64
          path: artifacts/local/release/DesktopPet.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the successful macOS build
        uses: actions/download-artifact@v4
        with:
          name: DesktopPet-macOS-arm64
          path: dist
      - name: Create or update the app pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_TAG: ${{ inputs.resource_tag }}
        run: |
          set -euo pipefail
          test -s dist/DesktopPet.dmg
          tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          digest="$(sha256sum dist/DesktopPet.dmg | cut -d ' ' -f1)"
          printf '%s  %s\n' "$digest" DesktopPet.dmg > dist/SHA256SUMS.txt
          cat > dist/RELEASE_NOTES.md <<EOF
          macOS arm64 alpha package built by [Actions run #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from commit \`${GITHUB_SHA}\`.

          Download and open \`DesktopPet.dmg\`, then drag \`DesktopPet.app\` onto the Applications shortcut before launching it. The app has an ad-hoc signature and is not Apple notarized. Direct double-click launch on a clean Mac has not yet been validated. LLM replies require your own LM Studio server and model.

          SHA-256: \`${digest}\`. A matching \`SHA256SUMS.txt\` is attached.

          Resources: [${RESOURCE_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RESOURCE_TAG}). Sources, known licenses, and unresolved rights: [ASSETS.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/ASSETS.md). Copyright contact/removal: [POLICY.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/POLICY.md).

          Contributors and users must not use this project to create or distribute sexualized content involving minors or minor-presenting characters.
          禁止使用本项目制作或传播涉及未成年人或明显幼态角色的色情、性化内容。
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/DesktopPet.dmg dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/DesktopPet.dmg dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DesktopPet 0.1.0 alpha ${GITHUB_RUN_NUMBER} - macOS arm64" \
              --notes-file dist/RELEASE_NOTES.md \
              --prerelease
          fi
