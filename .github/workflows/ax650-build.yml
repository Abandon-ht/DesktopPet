name: Build AX650 AppImage (manual)
run-name: AX650 ARM64 AppImage · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: AX650 branch, tag or commit to build
        required: true
        default: ax650
        type: string
      publish_release:
        description: Publish the verified AX650 AppImage as a prerelease
        required: true
        default: true
        type: boolean
      resource_tag:
        description: Existing Release containing character and CPU voice resources
        required: true
        default: resources-2026-09-29
        type: string
      axera_resource_tag:
        description: Locked Release containing the tested AX650 axmodels and frontend
        required: true
        default: resources-ax650-2026-10-11
        type: string

permissions:
  contents: read

concurrency:
  group: ax650-manual-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
      AX650_CI_ROOT: ${{ github.workspace }}/artifacts/local/ax650-ci
      SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/artifacts/local/ax650-ci/native/lib
      LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/local/ax650-ci/native/lib:${{ github.workspace }}/artifacts/local/ax650-ci/sdk/msp/out/lib
      LIBRARY_PATH: ${{ github.workspace }}/artifacts/local/ax650-ci/native/lib:${{ github.workspace }}/artifacts/local/ax650-ci/sdk/msp/out/lib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Record the resolved source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check target system and install build dependencies
        run: |
          source /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 22.04
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config python3 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxrender-dev libxfixes-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libegl1 libgl1 libgles2 libvulkan1 \
            libfuse2 patchelf squashfs-tools desktop-file-utils xdg-utils
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ax650-ubuntu2204-arm64-zipvoice-5473e19-sdk-71ac841
          cache-on-failure: true
      - name: Check formatting, UI syntax and packaging regressions
        run: |
          cargo fmt --all --check
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/i18n.js
          python3 -m unittest discover -s tools/ax650 -p test_tools.py -v
          python3 -m unittest discover -s tools/ax650 -p test_appimage.py -v
          python3 -m unittest discover -s tools/linux -p test_appimage.py -v
      - name: Check out pinned ZipVoice AXERA native source
        uses: actions/checkout@v4
        with:
          repository: Abandon-ht/sherpa-onnx
          ref: 5473e19db9c08e63aa41e4c273d9b3f743f1cd25
          path: artifacts/local/ax650-ci/sherpa
          persist-credentials: false
      - name: Check out public AX650 SDK (linking only)
        uses: actions/checkout@v4
        with:
          repository: AXERA-TECH/ax650n_bsp_sdk
          ref: 71ac84128ebc96219a9bd4348a49c43527bc605d
          path: artifacts/local/ax650-ci/sdk
          persist-credentials: false
      - name: Build AXERA shared runtime and verify the C / Rust ABI
        run: bash tools/ax650/ci-native.sh "$AX650_CI_ROOT/sherpa" "$AX650_CI_ROOT/sdk" "$AX650_CI_ROOT/native"
      - name: Compile desktop application, avatar host and diagnostic CLI
        run: cargo build --locked --release -p desktop-pet -p avatar-host-2d -p desktop-pet-ax650
      - name: Run application, voice pipeline and HTTP / Agent regressions
        run: cargo test --locked --release -p desktop-pet -p pet-voice-session -p pet-inference-http -p pet-agent-runtime
      - name: Verify ARM64 / glibc and stage code-only artifact
        run: |
          python3 tools/ax650/package.py --verify-binaries target/release --include-cli
          mkdir -p "$AX650_CI_ROOT/output/bin" "$AX650_CI_ROOT/output/lib"
          for binary in desktop-pet avatar-host-2d desktop-pet-ax650; do
            dependencies=$(ldd "target/release/$binary")
            if [[ "$dependencies" == *'not found'* ]]; then
              echo "$dependencies" >&2
              exit 1
            fi
            cp "target/release/$binary" "$AX650_CI_ROOT/output/bin/"
          done
          cp -a "$SHERPA_ONNX_LIB_DIR/"*.so* "$AX650_CI_ROOT/output/lib/"
          cp -a "$AX650_CI_ROOT/native/licenses" "$AX650_CI_ROOT/output/"
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['AX650_CI_ROOT']) / 'output'
          spec = importlib.util.spec_from_file_location('ax650_package', 'tools/ax650/package.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          elf = {str(p.relative_to(root)): module.verify_elf(p)
                 for p in sorted(root.glob('lib/*.so*')) if not p.is_symlink()}
          for path in root.glob('lib/*.so*'):
              deps = subprocess.check_output(['ldd', str(path)], text=True)
              if 'not found' in deps:
                  raise SystemExit(deps)
          record = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'sherpa_revision': '5473e19db9c08e63aa41e4c273d9b3f743f1cd25',
              'sdk_revision': '71ac84128ebc96219a9bd4348a49c43527bc605d',
              'system': 'Ubuntu 22.04 ARM64', 'rust': '1.95.0', 'provider': 'axera',
              'native_origin': 'source-built CI runtime; differs from the pinned board binary receipt',
              'elf': elf, 'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'scope': 'Binaries and open-source runtime only. No character, model, reference audio or AXERA SDK. Board UI/audio/NPU inference requires user validation.',
          }
          (root / 'build-provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + str(p.relative_to(root))
                   for p in sorted(root.rglob('*')) if p.is_file()]
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
          tar -czf "$AX650_CI_ROOT/DesktopPet-AX650-arm64-binaries.tar.gz" -C "$AX650_CI_ROOT" output
          (cd "$AX650_CI_ROOT" && sha256sum DesktopPet-AX650-arm64-binaries.tar.gz > DesktopPet-AX650-arm64-binaries.tar.gz.sha256)
      - name: Upload compiled binaries, runtime and provenance
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-AX650-arm64-binaries
          path: |
            artifacts/local/ax650-ci/DesktopPet-AX650-arm64-binaries.tar.gz
            artifacts/local/ax650-ci/DesktopPet-AX650-arm64-binaries.tar.gz.sha256
            artifacts/local/ax650-ci/output/build-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Download selected Release resources
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_TAG: ${{ inputs.resource_tag }}
        run: |
          mkdir -p "$AX650_CI_ROOT/release-assets"
          gh release download "$RESOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$AX650_CI_ROOT/release-assets" --pattern avatar.zip --pattern voice.zip \
            --pattern models-vad.zip --pattern models-asr.zip --pattern models-tts.zip \
            --pattern models-kws.zip --pattern SHA256SUMS.json
      - name: Install pinned Tauri bundling CLI
        run: npm install --prefix "$AX650_CI_ROOT/tauri-cli" --no-save --package-lock=false @tauri-apps/cli@2.11.4
      - name: Download tested AX650 NPU model resources
        env:
          GH_TOKEN: ${{ github.token }}
          AXERA_RESOURCE_TAG: ${{ inputs.axera_resource_tag }}
        run: |
          mkdir -p "$AX650_CI_ROOT/axera-release-assets"
          gh release download "$AXERA_RESOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$AX650_CI_ROOT/axera-release-assets" --pattern models-axera.zip --pattern SHA256SUMS.json
      - name: Stage AppImage with verified resources and native runtime
        env:
          RESOURCE_TAG: ${{ inputs.resource_tag }}
          AXERA_RESOURCE_TAG: ${{ inputs.axera_resource_tag }}
        run: |
          python3 tools/ax650/appimage.py prepare --binaries target/release \
            --output "$AX650_CI_ROOT/appimage-stage" \
            --assets-dir "$AX650_CI_ROOT/release-assets" --resource-tag "$RESOURCE_TAG" \
            --axera-assets-dir "$AX650_CI_ROOT/axera-release-assets" --axera-resource-tag "$AXERA_RESOURCE_TAG" \
            --native "$AX650_CI_ROOT/native" \
            --native-provenance "$AX650_CI_ROOT/output/build-provenance.json"
      - name: Bundle ARM64 AppImage with GTK / WebKit and avatar helper
        working-directory: apps/desktop
        run: |
          "$AX650_CI_ROOT/tauri-cli/node_modules/.bin/tauri" bundle --ci --bundles appimage \
            --config "$AX650_CI_ROOT/appimage-stage/tauri-appimage.conf.json"
      - name: Finalize software-GL launcher, remove SDK and audit the AppImage
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          mkdir -p "$AX650_CI_ROOT/release"
          mapfile -t images < <(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f)
          test "${#images[@]}" -eq 1
          python3 tools/ax650/appimage.py finish --image "${images[0]}" \
            --output "$AX650_CI_ROOT/release/DesktopPet-AX650-aarch64.AppImage" \
            --expected-commit "$SOURCE_COMMIT" --report "$AX650_CI_ROOT/release/appimage-audit.json"
          (cd "$AX650_CI_ROOT/release" && sha256sum DesktopPet-AX650-aarch64.AppImage > SHA256SUMS.txt)
      - name: Upload verified AppImage and audit
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-AX650-AppImage
          path: |
            artifacts/local/ax650-ci/release/DesktopPet-AX650-aarch64.AppImage
            artifacts/local/ax650-ci/release/SHA256SUMS.txt
            artifacts/local/ax650-ci/release/appimage-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-AX650-diagnostics
          path: artifacts/local/ax650-ci/release/*.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DesktopPet-AX650-AppImage
          path: release
      - name: Publish AX650 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          RESOURCE_TAG: ${{ inputs.resource_tag }}
          AXERA_RESOURCE_TAG: ${{ inputs.axera_resource_tag }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check --strict SHA256SUMS.txt)
          tag="ax650-v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF
          AX650 ARM64 AppImage built on Ubuntu 22.04 from commit \`${SOURCE_COMMIT}\`.

          LLM body deltas now feed realtime sentence segmentation, a bounded ZipVoice synthesis queue and continuous playback. The next sentence can synthesize while the current audio plays; each spoken turn shares one output stream and resampler, removing the per-sentence device restart and fixed 80 ms wait. ZipVoice still synthesizes complete sentences. The user reported successful AX650 functional validation of the corresponding local test build.

          Fixes the alpha.4 avatar startup failure by bundling XKB/XCB/xdo dynamic libraries and their licenses. The final extracted AppImage is checked for their actual dynamic loading, in addition to architecture, ABI and resource checks.

          Download **DesktopPet-AX650-aarch64.AppImage**, mark it executable and launch it from the existing XFCE X11 desktop. Software OpenGL and the AX650 device profile are enabled automatically. Character, interaction voices and CPU VAD/ASR/TTS/KWS models from \`${RESOURCE_TAG}\` are included. Settings and saves remain outside the image. Voice starts disabled in transcription mode; select recognition, conversation and speech for LLM / TTS settings. ASR / TTS defaults are 2 / 4 threads.

          Includes the pinned ZipVoice AXERA sherpa runtime and the tested NPU resources from \`${AXERA_RESOURCE_TAG}\`: SenseVoice AX650 10-second axmodel with matching tokens, ZipVoice distill encoder and four decoder parts with version-1 manifest, Vocos axmodel, lexicon and espeak frontend. Enable NPU acceleration in ASR / TTS settings to select these bundled models automatically; leave the NPU directories empty. Unchecking restores CPU model selection. The board supplies matching AXERA SDK libraries through \`/soc/lib\`. No AXERA SDK, user reference audio or local user data is redistributed.

          Requires glibc 2.35+, Ubuntu 22.04 ARM64 system libraries, X11 compositor and an AppIndicator/StatusNotifier tray host. If FUSE is unavailable, add \`--appimage-extract-and-run\`. CI verifies compilation, pure regressions, architecture, ABI, resources and packaging; real role, tray, microphone, playback and NPU inference remain user validation. Stable 30 fps is not required. No native Wayland acceptance.

          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Usage and manual validation: https://github.com/${GITHUB_REPOSITORY}/blob/${SOURCE_COMMIT}/BUILDING.ax650.zh-CN.md
          Resource provenance: https://github.com/${GITHUB_REPOSITORY}/blob/${SOURCE_COMMIT}/docs/ASSETS.md
          EOF
          assets=(release/DesktopPet-AX650-aarch64.AppImage release/SHA256SUMS.txt release/appimage-audit.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "${assets[@]}" --target "$SOURCE_COMMIT" \
              --prerelease --latest=false --title "DesktopPet AX650 0.1.0 alpha ${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md
          fi
