[package]
name = "pet-voice-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
cpal = "0.16"
crossbeam-queue = "0.3"
pet-inference-http = { path = "../inference-http" }
pet-agent-runtime = { path = "../agent-runtime" }
pet-web-retrieval = { path = "../web-retrieval" }
pet-persistence = { path = "../persistence" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
serde_json.workspace = true

# AX650 uses the tested ZipVoice AXERA fork and matching shared C API.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
sherpa-onnx = { git = "https://github.com/Abandon-ht/sherpa-onnx", rev = "5473e19db9c08e63aa41e4c273d9b3f743f1cd25", default-features = false, features = ["shared"] }

[target.'cfg(not(all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
sherpa-onnx = { git = "https://github.com/Abandon-ht/sherpa-onnx", rev = "5473e19db9c08e63aa41e4c273d9b3f743f1cd25", default-features = false, features = ["static"] }
