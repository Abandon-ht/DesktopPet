[package]
name = "pet-voice-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
cpal = "0.16"
crossbeam-queue = "0.3"
pet-inference-http = { path = "../inference-http" }
pet-persistence = { path = "../persistence" }
